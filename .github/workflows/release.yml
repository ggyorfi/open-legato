name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
            ~/.local/share/flatpak
          key: flatpak-${{ runner.os }}-${{ hashFiles('flatpak/*.yaml', 'flatpak/*.json') }}
          restore-keys: flatpak-${{ runner.os }}-

      - name: fetch existing repo from gh-pages
        run: |
          if git ls-remote --exit-code --heads https://github.com/${{ github.repository }}.git gh-pages > /dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages \
              https://github.com/${{ github.repository }}.git existing-pages
            if [ -d existing-pages/repo ]; then
              mv existing-pages/repo .
            fi
            rm -rf existing-pages
          fi

      - name: build to repo
        run: |
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --repo=repo \
            --disable-rofiles-fuse \
            --force-clean \
            build-dir \
            flatpak/dev.sprintster.OpenLegato.yaml
          flatpak build-update-repo --prune-depth=20 repo

      - name: build bundle
        run: flatpak build-bundle repo open-legato.flatpak dev.sprintster.OpenLegato

      - run: cp flatpak/open-legato.flatpakrepo repo/

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: repo/

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: open-legato.flatpak

  tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs: [flatpak, tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/flatpak-bundle/open-legato.flatpak
            artifacts/deb/*.deb
            artifacts/appimage/*.AppImage
          generate_release_notes: true

  pages:
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: repo
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
